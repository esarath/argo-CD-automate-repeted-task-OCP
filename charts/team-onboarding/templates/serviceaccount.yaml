{{- if .Values.serviceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "team-onboarding.saName" . }}
  namespace: {{ .Values.teamName }}
  labels:
    {{- include "team-onboarding.labels" . | nindent 4 }}
automountServiceAccountToken: false   # CI pipelines use bound tokens, not mounted
{{- end }}
