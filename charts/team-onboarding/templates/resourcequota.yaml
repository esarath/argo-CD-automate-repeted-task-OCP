apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.teamName }}-quota
  namespace: {{ .Values.teamName }}
  labels:
    {{- include "team-onboarding.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.cpuRequests | quote }}
    limits.cpu: {{ .Values.quota.cpuLimits | quote }}
    requests.memory: {{ .Values.quota.memoryRequests | quote }}
    limits.memory: {{ .Values.quota.memoryLimits | quote }}
    pods: {{ .Values.quota.pods | quote }}
    services: {{ .Values.quota.services | quote }}
    requests.storage: {{ .Values.quota.storageRequests | quote }}
    count/resourcequotas: "1"          # teams can't stack a second quota
    count/limitranges: "1"
