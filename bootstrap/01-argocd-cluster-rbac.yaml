# Grants the openshift-gitops ArgoCD instance permission to manage the
# onboarding resources cluster-wide. Without this, Applications fail with
# "namespaces is forbidden" style RBAC errors.
#
# Apply once:  oc apply -f bootstrap/01-argocd-cluster-rbac.yaml
#
# Principle of least privilege: only the resource types the onboarding
# chart creates are granted. Wildcard (*) is deliberately NOT used.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-team-onboarding-manager
  labels:
    app.kubernetes.io/part-of: gitops-platform
rules:
  # Namespace lifecycle (cluster-scoped resource)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Project request path (OpenShift wraps Namespace in Project)
  - apiGroups: ["project.openshift.io"]
    resources: ["projects", "projectrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Governance objects created inside each team namespace
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-team-onboarding-manager
  labels:
    app.kubernetes.io/part-of: gitops-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-team-onboarding-manager
subjects:
  # ArgoCD application controller (the component that applies manifests)
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
